services:
  - type: worker
    name: belrub-bot
    runtime: docker
    plan: free
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: SQLITE_PATH
        value: /app/data/bot.db
      - key: LOG_LEVEL
        value: INFO
    disk:
      name: belrub-data
      mountPath: /app/data
      sizeGB: 1
